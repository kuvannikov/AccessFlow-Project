[project]
name = "accessflow"
version = "0.1.0"
description = "Backend API of the employee onboarding and offboarding platform."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.148.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "hypothesis>=6.170.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-alembic>=0.13",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "ruff>=0.17.1",
    "testcontainers[postgres]>=4.15",
    "time-machine>=3.5.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "SIM",
    "RUF", "PT", "DTZ", "N", "C4", "RET", "PERF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.alembic]
script_location = "%(here)s/migrations"
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"

[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--test-alembic"]
# Replaced by tests/test_migrations.py until the first revision exists.
pytest_alembic_exclude = "single_head_revision"
filterwarnings = ["error"]
