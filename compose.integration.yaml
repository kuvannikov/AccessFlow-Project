services:
  postgres:
    ports: !override
      - "127.0.0.1:15432:5432"

  keycloak:
    environment:
      KC_HOSTNAME: http://localhost:18081/auth
    ports: !override
      - "127.0.0.1:18081:8080"

  api:
    environment:
      OIDC_ISSUER: http://localhost:18081/auth/realms/accessflow
    ports: !override
      - "127.0.0.1:18000:8000"
