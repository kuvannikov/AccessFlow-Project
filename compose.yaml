# Local development infrastructure: PostgreSQL and Keycloak.
# Every port is bound to 127.0.0.1, so the services are reachable
# only from this machine.
name: accessflow

services:
  postgres:
    image: postgres:18
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ACCESSFLOW_OWNER_PASSWORD: ${ACCESSFLOW_OWNER_PASSWORD:?Set ACCESSFLOW_OWNER_PASSWORD in .env}
      ACCESSFLOW_APP_PASSWORD: ${ACCESSFLOW_APP_PASSWORD:?Set ACCESSFLOW_APP_PASSWORD in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      # Mount at /var/lib/postgresql, not deeper: the postgres:18 image keeps
      # its data in a versioned subdirectory and would create an anonymous
      # volume otherwise.
      - postgres_data:/var/lib/postgresql
      # Init scripts run only on the first start, when the data directory is empty.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Check over TCP (-h 127.0.0.1): during the first start a temporary server
      # listens on a Unix socket only, so a socket check would report ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    # start-dev is for development only; --import-realm loads the realm files
    # from the mounted directory (a realm that already exists is skipped).
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      # The public URL of Keycloak. It becomes the issuer ("iss") in tokens.
      KC_HOSTNAME: http://localhost:8081
      # Serves /health/ready on the management port 9000.
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    volumes:
      # Only realm .json files belong in this directory: all of them are imported.
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl or wget, so the check uses bash and /dev/tcp.
      # "$$" is an escaped "$": otherwise Compose substitutes the variable itself.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; read -r line <&3; [[ $$line == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
