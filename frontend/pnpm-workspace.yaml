# pnpm 12 otherwise installs under a Node.js version outside package.json engines.
engineStrict: true

allowBuilds:
  # Hooks are installed explicitly from the repository root.
  lefthook: false
  # Their postinstall scripts only fetch the native binary when the platform
  # package is missing; pnpm installs that package as an optional dependency.
  esbuild: false
  unrs-resolver: false

overrides:
  # GHSA-g3hv-75wg-m249 is fixed only in 11.0.1, while ESLint and typescript-eslint
  # still ask for ^10; they call only minimatch() and Minimatch#match, kept in 11.
  minimatch: ^11.0.4
